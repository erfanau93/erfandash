<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <meta name="color-scheme" content="dark" />
    <title>Operations Hub — Little Fish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS for instant load feel */
      *,*::before,*::after{box-sizing:border-box}
      body{margin:0;background:#08090c;color:#f4f5f7;font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
      #root{min-height:100vh}
      /* Preloader skeleton */
      .preloader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08090c;z-index:9999}
      .preloader-spinner{width:32px;height:32px;border:3px solid rgba(45,212,191,0.2);border-top-color:#2dd4bf;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Preloader shown until React hydrates -->
      <div class="preloader">
        <div class="preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
